{% extends "base.html" %}

{% block content %}
<h1>Job Description</h1>
<p class="text-muted">{{ application.company }} — {{ application.position }}</p>

<form method="post" class="mt-3">
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="15">{{ jd.description if jd else '' }}</textarea>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('application_detail', id=application.id) }}" class="btn btn-outline-secondary">Back</a>
    </div>
</form>
{% endblock %}
