{% extends "base.html" %}

{% block content %}
<div class="card border-danger mt-4" style="max-width: 500px; margin: auto;">
    <div class="card-body text-center">
        <h4 class="card-title text-danger">Confirm Delete</h4>
        <p>Are you sure you want to delete the application for
            <strong>{{ application.position }}</strong> at <strong>{{ application.company }}</strong>?</p>
        <p class="text-muted small">This will also remove any linked job description.</p>
        <form method="post" class="d-inline">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
        <a href="{{ url_for('application_detail', id=application.id) }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </div>
</div>
{% endblock %}
