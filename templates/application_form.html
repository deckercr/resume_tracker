{% extends "base.html" %}

{% block content %}
<h1>{{ 'Edit Application' if application else 'New Application' }}</h1>

<form method="post" class="mt-3">
    <div class="row mb-3">
        <div class="col-md-4">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date"
                   value="{{ application.date.strftime('%Y-%m-%d') if application and application.date else today }}">
        </div>
        <div class="col-md-4">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
                {% for s in statuses %}
                    <option value="{{ s }}" {% if application and application.status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="salary" class="form-label">Salary</label>
            <input type="text" class="form-control" id="salary" name="salary"
                   value="{{ application.salary if application else '' }}">
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="company" class="form-label">Company *</label>
            <input type="text" class="form-control" id="company" name="company" required
                   value="{{ application.company if application else '' }}">
        </div>
        <div class="col-md-6">
            <label for="position" class="form-label">Position *</label>
            <input type="text" class="form-control" id="position" name="position" required
                   value="{{ application.position if application else '' }}">
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location"
                   value="{{ application.location if application else '' }}">
        </div>
        <div class="col-md-6">
            <label for="job_id" class="form-label">Job ID</label>
            <input type="text" class="form-control" id="job_id" name="job_id"
                   value="{{ application.job_id if application else '' }}">
        </div>
    </div>

    <div class="mb-3">
        <label for="url" class="form-label">URL</label>
        <input type="url" class="form-control" id="url" name="url"
               value="{{ application.url if application else '' }}">
    </div>

    <div class="mb-3">
        <label for="contact" class="form-label">Contact</label>
        <input type="text" class="form-control" id="contact" name="contact"
               value="{{ application.contact if application else '' }}">
    </div>

    <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="3">{{ application.notes if application else '' }}</textarea>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            {{ 'Save Changes' if application else 'Add Application' }}
        </button>
        <a href="{{ url_for('application_detail', id=application.id) if application else url_for('index') }}"
           class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
